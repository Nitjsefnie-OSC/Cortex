name: Claude bot
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: read
  statuses: write
jobs:
  claude:
    uses: ./.github/workflows/shared-claude.yml
    with:
      engine-ref: ${{ github.sha }}
      auto-merge: ${{ vars.CLAUDE_AUTOMERGE == 'true' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
