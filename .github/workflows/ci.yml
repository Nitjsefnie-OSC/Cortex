name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    uses: ./.github/workflows/shared-tests.yml
    with:
      engine-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runners: '["ubuntu-latest", "windows-latest", "macos-latest", "ubuntu-24.04-arm"]'
  release-tag:
    needs: [tests]
    if: always() && !cancelled() && needs.tests.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/shared-release.yml
    with:
      engine-ref: ${{ github.sha }}
